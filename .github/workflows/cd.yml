name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: success() && hashFiles('trivy-image-results.sarif') != ''
        with:
          sarif_file: 'trivy-image-results.sarif'

      - name: Output image tags
        run: |
          echo "Image pushed: ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "Image pushed: ghcr.io/${{ github.repository }}:latest"

  notify:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ failure() }}
    steps:
      - name: Notify Slack on failure
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "⚠️  SLACK_WEBHOOK_URL secret not set — skipping Slack notification."
            echo "    To enable: repo Settings → Secrets → New repository secret → SLACK_WEBHOOK_URL"
            exit 0
          fi
          curl -s -X POST -H 'Content-type: application/json' \
            --data '{"text":"❌ CD pipeline failed on `${{ github.repository }}` at commit `${{ github.sha }}`.\nView run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "${SLACK_WEBHOOK_URL}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ─────────────────────────────────────────────────────────────────────────
  # PRODUCTION DEPLOY (manual approval gate)
  # ─────────────────────────────────────────────────────────────────────────
  # To activate:
  #   1. Go to repo Settings → Environments → Create "production"
  #   2. Add a Required Reviewer (yourself or a teammate)
  #   3. Uncomment the job below and fill in the deploy command
  #      for your target (Docker Compose + SSH, IBM Code Engine CLI, etc.)
