# Local development override — builds from source with live reload
# Usage: docker compose -f docker-compose.dev.yml up --build
#
# This file is NOT used in CI/CD. The production docker-compose.yml
# pulls the pre-built GHCR image; this file builds locally.

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - APP_NAME=Cloud11 API (dev)
    volumes:
      # Bind-mount source for live changes (node --watch picks these up)
      - ./src:/app/src:ro
    restart: "no"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
