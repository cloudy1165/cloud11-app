apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud11-app
  namespace: staging
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - staging.cloud11-app.example.com
      secretName: cloud11-app-tls
  rules:
    - host: staging.cloud11-app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud11-app
                port:
                  number: 80
