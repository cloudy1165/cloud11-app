apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud11-app
  namespace: staging
  labels:
    app: cloud11-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud11-app
  template:
    metadata:
      labels:
        app: cloud11-app
    spec:
      containers:
        - name: app
          image: ghcr.io/cloudy1165/cloud11-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
